[workspace]
resolver = "3"
members = [
    "cargo/senaling-core",
    "cargo/senaling-ffi",
    "cargo/xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata]
name = "senaling"

[workspace.dependencies]
anyhow = "1.0.104"
libc = "0.2.180"
log = "0.4.34"
safer-ffi = "0.1.13"
