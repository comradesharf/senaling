[workspace]
resolver = "3"
members = [
    "cargo/senaling-core",
    "cargo/senaling-binding",
    "cargo/uniffi-bindgen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata]
name = "senaling"

[workspace.dependencies]
anyhow = "1.0.104"
log = "0.4.34"
uniffi = { version = "0.32.0", features = ["build", "cli"] }
